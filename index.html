}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0f17; --card:#151b26; --ink:#e5e7eb; --sub:#9ca3af; --line:#273042; --brand-bg:#14213d;
    --brand:#3b82f6; --red:#f87171; --red-bg:#3a1414; --yellow:#fbbf24; --yellow-bg:#3a2a0a;
    --green:#4ade80; --green-bg:#0f2e1a; --gray:#9ca3af; --gray-bg:#1f2633; --warn-bg:#2a1a0a; --warn-line:#9a5b1a;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0f17; --card:#151b26; --ink:#e5e7eb; --sub:#9ca3af; --line:#273042; --brand-bg:#14213d;
  --brand:#3b82f6; --red:#f87171; --red-bg:#3a1414; --yellow:#fbbf24; --yellow-bg:#3a2a0a;

}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  -webkit-text-size-adjust:100%}
.app{max-width:440px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
@media (min-width:600px){ .app{margin:24px auto;min-height:calc(100vh - 48px);border:1px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.12)} }
header{display:flex;align-items:center;gap:8px;padding:calc(16px + env(safe-area-inset-top)) 16px 8px}
header h1{font-size:20px;margin:0;flex:1}
.back{border:0;background:none;color:var(--ink);font-size:22px;padding:0 6px 0 0;cursor:pointer}
.iconbtn{border:0;background:var(--brand);color:var(--brand-ink);width:36px;height:36px;border-radius:50%;font-size:22px;line-height:36px;cursor:pointer}
main{flex:1;overflow-y:auto;padding:0 16px 96px}
nav.tabs{position:sticky;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;padding:10px 0 12px;color:var(--sub);font-size:11px;cursor:pointer}
nav.tabs button .i{display:block;font-size:20px;margin-bottom:2px}
nav.tabs button.on{color:var(--brand);font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 12px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.doc{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none}
.doc .t{font-weight:700;font-size:15px}
.doc .s{color:var(--sub);font-size:13px;margin-top:2px}
.doc .m{font-size:13px;margin-top:6px;font-weight:600}
.dday{margin-left:auto;font-weight:800;font-size:15px;padding:4px 8px;border-radius:8px;white-space:nowrap}
.lv-red .dot{background:var(--red)} .lv-red .dday{color:var(--red);background:var(--red-bg)} .lv-red .m{color:var(--red)}
.lv-yellow .dot{background:var(--yellow)} .lv-yellow .dday{color:var(--yellow);background:var(--yellow-bg)} .lv-yellow .m{color:var(--yellow)}
.lv-green .dot{background:var(--green)} .lv-green .dday{color:var(--green);background:var(--green-bg)}
.lv-gray .dot{background:var(--gray)} .lv-gray .dday{color:var(--gray);background:var(--gray-bg)} .lv-gray .m{color:var(--gray)}
.empty{text-align:center;color:var(--sub);padding:36px 0}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;background:var(--brand);color:var(--brand-ink);margin-top:10px}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--card);color:var(--red);border:1px solid var(--line)}
.btn.sm{padding:9px 12px;font-size:13px;margin-top:8px;width:auto;display:inline-block}
.row2{display:flex;gap:8px} .row2 .btn{flex:1}
label.f{display:block;font-size:13px;color:var(--sub);margin:14px 0 6px}
input,select{width:100%;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.sec{font-size:13px;color:var(--sub);font-weight:700;margin:18px 0 8px;display:flex;justify-content:space-between}
.alerts .a{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.alerts .a:last-child{border-bottom:0}
.alerts .past{color:var(--sub);text-decoration:line-through}
.warn{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:12px;padding:12px;font-size:13px;margin-bottom:10px;line-height:1.5}
.tip{font-size:13px;line-height:1.6;color:var(--ink)}
.tip .src{color:var(--sub);font-size:12px;margin-top:6px}
.banner{background:var(--brand);color:var(--brand-ink);border-radius:12px;padding:12px;font-size:14px;margin-bottom:10px}
.prog{height:6px;background:var(--gray-bg);border-radius:4px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--brand)}
.stage{margin-bottom:10px}
.stage h3{font-size:14px;margin:0;display:flex;justify-content:space-between;cursor:pointer}
.stage h3 span{color:var(--sub);font-weight:400;font-size:12px}
.item{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.45}
.item:first-child{border-top:0}
.item input{width:20px;height:20px;flex:none;margin-top:1px}
.item .n{font-size:12px;color:var(--sub);margin-top:2px}
.item.done .x{text-decoration:line-through;color:var(--sub)}
.small{font-size:12px;color:var(--sub);line-height:1.5}
.mem{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.mem:last-child{border-bottom:0}
.link{border:0;background:none;color:var(--red);cursor:pointer;font-size:13px;padding:4px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:.95}
/* 할 일 */
.task{border-left:4px solid var(--line)}
.task.overdue{border-left-color:var(--red)} .task.now{border-left-color:var(--brand)} .task.soon{border-left-color:var(--yellow)}
.task .tt{font-weight:700;font-size:15px}
.task .when{font-size:13px;margin-top:3px;font-weight:600}
.task.overdue .when{color:var(--red)} .task.now .when{color:var(--brand)} .task.soon .when{color:var(--yellow)}
.task .act{font-size:13px;margin-top:6px;line-height:1.5}
.task .ex{font-size:13px;margin-top:6px;background:var(--brand-bg);border-radius:8px;padding:6px 8px}
.task .wn{font-size:12px;margin-top:6px;color:var(--yellow)}
.hero{background:var(--brand);color:var(--brand-ink);border-radius:16px;padding:16px;margin-bottom:12px}
.hero .big{font-size:22px;font-weight:800;margin-top:2px}
.hero .s{opacity:.9;font-size:13px;margin-top:4px}
/* 지갑 */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.thumb{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer}
.thumb img{display:block;width:100%;height:110px;object-fit:cover;background:var(--gray-bg)}
.thumb div{padding:6px 8px;font-size:12px}
.overlay{position:fixed;inset:0;background:#000;z-index:30;display:flex;flex-direction:column}
.overlay img{flex:1;min-height:0;width:100%;object-fit:contain}
.overlay .bar{display:flex;justify-content:space-between;align-items:center;color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;font-size:15px}
.overlay button{background:none;border:0;color:#fff;font-size:15px;padding:8px}
/* 체류일 */
.stat{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.stat:last-child{border-bottom:0}
.stat b{font-size:16px}
.stayrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stayrow input,.stayrow select{padding:10px;font-size:15px}
.tel{color:var(--brand);text-decoration:none;font-weight:700}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;margin-top:10px}
.chk input{width:18px;height:18px}
</style>

/* ================= 사본 지갑 저장소 (IndexedDB, 이 휴대폰 안에만) ================= */
const Wallet = {
  db:null,
  open(){ return this.db ||= new Promise((ok,no)=>{ const r=indexedDB.open('gaengsin-wallet',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('copies',{keyPath:'id'}); r.onsuccess=()=>ok(r.result); r.onerror=()=>no(r.error); }); },
  async tx(mode, fn){ const db=await this.open(); return new Promise((ok,no)=>{ const t=db.transaction('copies',mode); const st=t.objectStore('copies');
    const res=fn(st); t.oncomplete=()=>ok(res && res.result!==undefined ? res.result : res); t.onerror=()=>no(t.error); }); },
  put(rec){ return this.tx('readwrite', st=>st.put(rec)); },
  del(id){ return this.tx('readwrite', st=>st.delete(id)); },
  all(){ return this.tx('readonly', st=>st.getAll()).then(r=>(r||[]).sort((a,b)=>b.created-a.created)); }
};
let _urls=[];
function blobURL(b){ const u=URL.createObjectURL(b); _urls.push(u); return u; }
function freeURLs(){ _urls.forEach(u=>URL.revokeObjectURL(u)); _urls=[]; }

/* ================= 공통 ================= */
const $ = s=>document.querySelector(s);
const $$ = s=>[...document.querySelectorAll(s)];
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2000); }
function C(){ return COUNTRIES[S.country]||COUNTRIES.VN; }
function typeInfo(type){ return C().docs[type] || COUNTRIES.VN.docs[type] || COUNTRIES.ETC.docs[type] || {name:type,alerts:[60,30,7],tip:''}; }
function docName(d){ return d.type==='other' ? (d.custom||'기타 서류') : typeInfo(d.type).name; }
function memName(id){ return (S.members.find(m=>m.id===id)||{name:'?'}).name; }
function level(n){ return n<0?'gray':n<=30?'red':n<=90?'yellow':'green'; }
function ddayText(n){ return n<0 ? '만료됨' : n===0 ? 'D-Day' : 'D-'+n.toLocaleString(); }
function pickFile(accept, capture){ return new Promise(ok=>{ const f=$('#fAny'); f.value=''; f.accept=accept;

/* 사진을 긴 변 max px JPEG 로 줄이기 (지갑 보관·OCR 공용) */
async function toCanvas(src, max, gray){
  const bmp = src instanceof HTMLCanvasElement ? src : await createImageBitmap(src);
  const k=Math.min(1, max/Math.max(bmp.width,bmp.height));
  const cv=document.createElement('canvas'); cv.width=Math.round(bmp.width*k); cv.height=Math.round(bmp.height*k);
  const g=cv.getContext('2d'); if(gray) g.filter='grayscale(1) contrast(1.4)'; g.drawImage(bmp,0,0,cv.width,cv.height); return cv;
}
function canvasToJpeg(cv){ return new Promise(ok=>cv.toBlob(b=>ok(b),'image/jpeg',0.85)); }
async function saveCopy(src, m, docId, label){
  const blob = await canvasToJpeg(await toCanvas(src, 1600, false));
  await Wallet.put({id:uid(), m, docId:docId||null, label, blob, created:Date.now()});
}

/* ================= 홈: 지금 할 일 ================= */
function taskCard(t){
  const when = t.status==='overdue' ? `${t.to} 만료됨`
    : t.status==='now' ? (t.to>=T() && t.from<=T() ? `지금 할 때 · ${t.to}까지` : `${t.to}까지`)
    : `${t.from}부터 · ${GL.diff(T(),t.from)}일 뒤 시작`;
  const period = t.from!==t.to ? `<div class="small">${t.from} ~ ${t.to}</div>` : '';
  return `<div class="card task ${t.status}">
    <div class="small">${esc(memName(t.m))}</div>
    <div class="tt">${esc(t.title)}</div>
    <div class="when">${when}</div>${period}
    ${t.act?`<div class="act">${esc(t.act)}</div>`:''}
    ${t.extra.map(x=>`<div class="ex">👪 ${esc(x)}</div>`).join('')}
    ${t.warn.map(x=>`<div class="wn">⚠ ${esc(x)}</div>`).join('')}
    <div><button class="btn ghost sm" data-doc="${t.docId}">서류·준비물 보기</button>
    ${t.status!=='later'?`<button class="btn sm" data-done="${esc(t.id)}" style="margin-left:6px">✓ 했어요</button>`:''}</div></div>`;
}
function contactsHTML(){
  const base = (CONTACTS[S.country]||CONTACTS.VN).map(c=>`<div class="mem"><div><div style="font-weight:600;font-size:14px">${esc(c.name)}</div><div class="small">${esc(c.note||'')}</div></div>
    <div style="text-align:right">${c.tels?c.tels.map(([s,n])=>`<a class="tel" href="tel:${n}">${esc(s)}</a>`).join('<br>'):`<a class="tel" href="${c.url}" target="_blank" rel="noopener">열기</a>`}</div></div>`).join('');
  const mine = S.contacts.map(c=>`<div class="mem"><div style="font-weight:600;font-size:14px">${esc(c.name)}</div><a class="tel" href="tel:${esc(c.tel.replace(/[^+\d]/g,''))}">${esc(c.tel)}</a></div>`).join('');
  return mine+base;

/* ================= 서류 읽기: PDF 글자 / 사진 OCR (모두 휴대폰 안에서) ================= */
const LIB = {
  pdf: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
  pdfWorker: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',
  ocr: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js'
};
const _loaded={};
function loadScript(src){ return _loaded[src] ||= new Promise((ok,no)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=no; document.head.appendChild(s); }); }
async function ocr(src, say){
  await loadScript(LIB.ocr);
  try{ src = await toCanvas(src, 2000, true); }catch(e){ /* 줄이기 실패하면 원본 그대로 */ }
  const { data } = await Tesseract.recognize(src, 'eng', { logger: m=>{ if(say && m.status==='recognizing text') say(`글자 읽는 중… ${Math.round(m.progress*100)}%`); } });
  return data.text;
}
async function readPdf(file, say){
  await loadScript(LIB.pdf);
  pdfjsLib.GlobalWorkerOptions.workerSrc = LIB.pdfWorker;
  const doc = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  let text='';
  for(let p=1; p<=Math.min(doc.numPages,3); p++){
    const tc = await (await doc.getPage(p)).getTextContent();
    text += tc.items.map(it=>it.str + (it.hasEOL?'\n':' ')).join('') + '\n';
  }
  const page1 = await doc.getPage(1), vp = page1.getViewport({ scale: 2 });
  const cv = document.createElement('canvas'); cv.width=vp.width; cv.height=vp.height;
  await page1.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
  if(GA.findExpiry(text).date) return {text, page:cv};
  say && say('스캔한 PDF라 그림으로 읽는 중…');   // 글자 없는 스캔 PDF
  return {text: await ocr(cv, say), page:cv};
}

/* ================= 서류 상세 ================= */
function vDetail(){
  const d=S.docs.find(x=>x.id===R.id); if(!d) return go('docs');
  const ti=typeInfo(d.type), n=dleft(d.exp);
  head(docName(d), ()=>go(R.tab==='home'?'home':'docs'));
  const offs=[...ti.alerts].sort((a,b)=>b-a);
  const rows=offs.map(o=>{ const dt=GL.addDays(d.exp,-o); const past=dt<T();
    return `<div class="a ${past?'past':''}"><span>D-${o}</span><span>${dt}${past?' (지남)':''}</span></div>`; }).join('')
    + `<div class="a"><span>만료일</span><span>${d.exp}</span></div>`;
  const tasks = GL.buildTasks({...S, done:{}}, T(), docName).filter(t=>t.docId===d.id);
  const prepKey = d.id+':'+d.exp, prep = GL.PREP[d.type]||[], pdone = S.prep[prepKey]||{};
  let h='';
  if(R.justSaved) h+=`<div class="banner">${R.changed?'수정했습니다. 달력 일정도 다시 등록해 주세요 (이미 등록한 일정은 앱에서 바꿀 수 없습니다).':'저장했습니다. 홈에 할 일이 생겼고, 아래 버튼으로 휴대폰 달력에도 넣을 수 있습니다.'}</div>`;
  h+=`<div class="card"><div style="display:flex;align-items:center" class="lv-${level(n)}">
      <div><div class="small">${esc(memName(d.m))}</div><div style="font-size:15px;font-weight:700;margin-top:2px">${d.exp} 만료</div></div>
      <span class="dday" style="margin-left:auto">${ddayText(n)}</span></div>
      ${d.memo?`<div class="small" style="margin-top:8px">메모: ${esc(d.memo)}</div>`:''}</div>`;
  h+=GL.docWarnings(S,d).map(x=>`<div class="warn">⚠ ${esc(x)}</div>`).join('');
  if(tasks.length) h+=`<div class="sec">할 일</div>`+tasks.map(t=>`<div class="card task ${t.status}"><div class="tt">${esc(t.title)}</div>
      <div class="when">${t.from===t.to?t.to:`${t.from} ~ ${t.to}`}</div>${t.act?`<div class="act">${esc(t.act)}</div>`:''}
      ${t.extra.map(x=>`<div class="ex">👪 ${esc(x)}</div>`).join('')}</div>`).join('');
  if(prep.length) h+=`<div class="sec">연장 준비물 <span>${Object.values(pdone).filter(Boolean).length}/${prep.length}</span></div><div class="card">`+
    prep.map((p,i)=>`<label class="item ${pdone[i]?'done':''}"><input type="checkbox" data-p="${i}" ${pdone[i]?'checked':''}><div class="x">${esc(p)}</div></label>`).join('')+
    `<div class="small" style="margin-top:6px">${SRC_NOTE}</div></div>`;
  h+=`<div class="sec">사본</div><div class="card"><div class="grid" id="cp"></div>
      <div class="row2"><button class="btn ghost" id="cCam">📷 사본 찍기</button><button class="btn ghost" id="cPic">🖼 고르기</button></div></div>`;
  h+=`<div class="sec">알림 일정</div><div class="card alerts">${rows}</div>
      <button class="btn" id="cal">📅 휴대폰 달력에 등록</button>
      <div class="small" style="margin-top:6px">지나지 않은 날짜만 오전 9시 알림으로 들어갑니다.</div>`;
  if(ti.tip) h+=`<div class="sec">갱신 안내</div><div class="card tip">${esc(ti.tip)}<div class="src">${SRC_NOTE}</div></div>`;
  h+=`<div class="row2"><button class="btn ghost" id="ed">수정</button><button class="btn danger" id="del">삭제</button></div>`;
  $('#mn').innerHTML=h;
  $$('[data-p]').forEach(x=>x.onchange=()=>{ (S.prep[prepKey] ||= {})[x.dataset.p]=x.checked; save(); vDetail(); });
  Wallet.all().then(all=>{
    const mine=all.filter(c=>c.docId===d.id), box=$('#cp'); if(!box) return;
    box.innerHTML = mine.length ? mine.map(c=>`<div class="thumb" data-c="${c.id}"><img src="${blobURL(c.blob)}" alt=""><div>${new Date(c.created).toLocaleDateString('ko-KR')}</div></div>`).join('')
      : `<div class="small" style="grid-column:1/-1">아직 사본이 없습니다. 호텔·은행·공안에서 바로 보여 줄 수 있게 찍어 두세요.</div>`;
    $$('[data-c]').forEach(el=>el.onclick=()=>viewCopy(mine.find(c=>c.id===el.dataset.c)));
  }).catch(()=>{});
  const addCopy=async cap=>{ const f=await pickFile('image/*',cap); if(!f) return; await saveCopy(f, d.m, d.id, docName(d)); toast('사본을 보관했습니다'); vDetail(); };
  $('#cCam').onclick=()=>addCopy(true); $('#cPic').onclick=()=>addCopy(false);
  $('#cal').onclick=()=>downloadICS(d);
  $('#ed').onclick=()=>go('edit',{id:d.id});
  $('#del').onclick=async()=>{ if(!confirm('이 서류와 사본을 삭제할까요?')) return;
    S.docs=S.docs.filter(x=>x.id!==d.id); save();
    try{ for(const c of (await Wallet.all()).filter(c=>c.docId===d.id)) await Wallet.del(c.id); }catch(e){}
    go('docs'); toast('삭제했습니다'); };
}

/* ================= 사본 지갑 ================= */
function viewCopy(c){
  if(!c) return;
  const o=document.createElement('div'); o.className='overlay';
  o.innerHTML=`<div class="bar"><span>${esc(memName(c.m))} · ${esc(c.label)}</span><span><button id="ovDel">삭제</button><button id="ovX">닫기 ✕</button></span></div><img src="${URL.createObjectURL(c.blob)}" alt="">`;
  document.body.appendChild(o);
  const close=()=>{ URL.revokeObjectURL(o.querySelector('img').src); o.remove(); };
  o.querySelector('#ovX').onclick=close;
  o.querySelector('#ovDel').onclick=async()=>{ if(!confirm('이 사본을 삭제할까요?')) return; await Wallet.del(c.id); close(); render(); toast('삭제했습니다'); };
}
function vWallet(){
  head('사본 지갑', null, `<button class="iconbtn" id="wAdd" aria-label="사본 추가">+</button>`);
  $('#mn').innerHTML=`<div class="small" style="margin-bottom:10px">여권·노동허가서·체류증 사진을 이 휴대폰 안에만 보관합니다. 호텔 체크인, 은행, 공안 확인 때 바로 보여 주세요.</div><div id="wl"><div class="small">불러오는 중…</div></div>`;
  $('#wAdd').onclick=()=>go('wadd');
  Wallet.all().then(all=>{
    const box=$('#wl'); if(!box) return;
    if(!all.length){ box.innerHTML=`<div class="empty">보관한 사본이 없습니다<br><button class="btn" id="wAdd2" style="max-width:220px;margin:16px auto 0">📷 사본 찍기</button></div>`; $('#wAdd2').onclick=()=>go('wadd'); return; }
    box.innerHTML = S.members.map(m=>{ const cs=all.filter(c=>c.m===m.id); if(!cs.length) return '';
      return `<div class="sec">${esc(m.name)}</div><div class="grid">`+cs.map(c=>`<div class="thumb" data-c="${c.id}"><img src="${blobURL(c.blob)}" alt=""><div>${esc(c.label)}</div></div>`).join('')+`</div>`; }).join('');
    $$('[data-c]').forEach(el=>el.onclick=()=>viewCopy(all.find(c=>c.id===el.dataset.c)));
  }).catch(()=>{ $('#wl').innerHTML='<div class="warn">이 브라우저에서는 사본을 보관할 수 없습니다.</div>'; });
}
function vWadd(){
  head('사본 추가', ()=>go('wallet'));
  const opts = S.docs.map(d=>`<option value="${d.id}">${esc(memName(d.m))} · ${esc(docName(d))}</option>`).join('');
  $('#mn').innerHTML=`<label class="f">어떤 서류인가요?</label><select id="wd">${opts}<option value="">기타 (직접 이름 입력)</option></select>
    <div id="wcw" style="display:${S.docs.length?'none':'block'}"><label class="f">누구의 것인가요?</label><select id="wm">${S.members.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select>
    <label class="f">이름</label><input id="wl2" placeholder="예: 비자 사본, 학생증"></div>
    <div class="row2"><button class="btn" id="wc">📷 찍기</button><button class="btn ghost" id="wp">🖼 고르기</button></div>`;
  $('#wd').onchange=e=>$('#wcw').style.display=e.target.value?'none':'block';
  const add=async cap=>{ const f=await pickFile('image/*',cap); if(!f) return;
    const did=$('#wd').value, d=S.docs.find(x=>x.id===did);
    await saveCopy(f, d?d.m:$('#wm').value, d?d.id:null, d?docName(d):($('#wl2').value.trim()||'기타'));
    toast('사본을 보관했습니다'); go('wallet'); };
  $('#wc').onclick=()=>add(true); $('#wp').onclick=()=>add(false);
}

/* ================= 체류일 ================= */

  if(rp){
    h+=`<div class="card">

      <div class="stat"><span>세금 거주자 기준 183일까지</span><b>${rp.resident183?'넘음':rp.daysTo183+'일 남음'}</b></div>

      <div class="small" style="margin:-4px 0 10px">베트남은 한 해 183일 이상, 또는 첫 입국일부터 12개월 안에 183일 이상 머물면 세금 거주자가 됩니다. 입국일·출국일은 모두 1일로 셉니다.</div>`;

    h+=`<div class="stat"><span>마지막 한국 출국</span><b>${rp.krLeave}</b></div>
      <div class="stat"><span>3개월 기준 충족일</span><b>${rp.hi3}${rp.hi3<=T()&&!rp.krNow?' ✔':''}</b></div>

  } else h+=`<div class="card small">베트남에 들어온 날과 나간 날을 적으면 세금 183일, 한국 건강보험 해외 체류 기준을 자동으로 계산합니다. 회사 출장으로 한국에 다녀온 것도 적어 주세요.</div>`;
  h+=`<div class="sec">출입국 기록 <span>최근 순</span></div>`;

      <div><label class="f" style="margin-top:0">베트남 입국</label><input type="date" data-s="${s.i}" data-k="in" value="${s.in||''}"></div>
      <div><label class="f" style="margin-top:0">베트남 출국</label><input type="date" data-s="${s.i}" data-k="out" value="${s.out||''}"></div></div>
      <div class="stayrow" style="margin-top:8px;align-items:center">
      <select data-s="${s.i}" data-k="to" ${s.out?'':'disabled'}><option value="KR" ${s.to!=='ETC'?'selected':''}>한국으로 출국</option><option value="ETC" ${s.to==='ETC'?'selected':''}>다른 나라로 출국</option></select>
      <div style="text-align:right"><span class="small">${s.out?'':'지금 베트남에 있음'}</span> <button class="link" data-sdel="${s.i}">삭제</button></div></div></div>`).join('');

function blobToData(b){ return new Promise(ok=>{ const r=new FileReader(); r.onload=()=>ok(r.result); r.readAsDataURL(b); }); }
async function exportBackup(){
  let copies=[]; try{ copies=await Promise.all((await Wallet.all()).map(async c=>({...c, blob:await blobToData(c.blob)}))); }catch(e){}
  const url=URL.createObjectURL(new Blob([JSON.stringify({app:'gaengsin-alimi', state:S, copies})],{type:'application/json'}));
  const a=document.createElement('a'); a.href=url; a.download=`갱신알리미_백업_${T()}.json`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
}
function importBackup(f){
  const r=new FileReader();
  r.onload=async()=>{ try{
    const o=JSON.parse(r.result); const st=o.state||o; if(!st.docs||!st.members) throw 0;
    S=Object.assign(fresh(), st); save();
    for(const c of (o.copies||[])){ const b=await (await fetch(c.blob)).blob(); await Wallet.put({...c, blob:b}); }
    toast('불러왔습니다'); R.tab='home'; go('home');
  }catch(_){ toast('백업 파일이 아닙니다'); } };
  r.readAsText(f);
}

/* ---- 체크리스트 상세 ---- */
function vList(){
  const k=R.id, c=CHECKLISTS[k], back=R.back||'more'; head(c.name+' 체크리스트', ()=>{ R.tab=back==='home'?'home':'more'; go(back); });
  const base=S.base[k];
  let h=`<label class="f">${c.baseLabel}</label><input type="date" id="bd" value="${base||''}">
         <div class="small" style="margin:6px 0 12px">이 날짜로 단계별 시기를 계산합니다.</div>`;
  h+=c.stages.map(st=>{
    const its=itemsFor(k).filter(i=>i.st===st.id); if(!its.length) return '';
    const when = (base && st.off!==null) ? GL.addDays(base,st.off)+(st.off<0?'까지':st.off>0?' 무렵':'') : '';
    const open = R.open[k+st.id]!==false;
    return `<div class="card stage"><h3 data-s="${st.id}">${open?'▼':'▶'} ${st.name} <span>${when}</span></h3>
      ${open?its.map(i=>{ const on=!!S.checks[k+':'+i.id];
        return `<label class="item ${on?'done':''}"><input type="checkbox" data-i="${i.id}" ${on?'checked':''}>
          <div><div class="x">${esc(i.t)}</div>${i.n?`<div class="n">${esc(i.n)}</div>`:''}</div></label>`; }).join(''):''}</div>`;
  }).join('');
  h+=`<div class="small" style="margin-top:8px">${SRC_NOTE}</div>`;
  $('#mn').innerHTML=h;
  $('#bd').onchange=e=>{ S.base[k]=e.target.value; save(); vList(); };
  $$('[data-s]').forEach(x=>x.onclick=()=>{ const key=k+x.dataset.s; R.open[key]=R.open[key]===false; vList(); });
  $$('[data-i]').forEach(x=>x.onchange=()=>{ S.checks[k+':'+x.dataset.i]=x.checked; save(); x.closest('.item').classList.toggle('done',x.checked); });
}

/* ================= 달력 파일(.ics) ================= */
function icsEsc(s){ return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n'); }
function downloadICS(d){
  const ti=typeInfo(d.type), who=memName(d.m), nm=docName(d);
  const now=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const pts=[...ti.alerts.map(o=>({o,dt:GL.addDays(d.exp,-o)})), {o:0,dt:d.exp}].filter(p=>p.dt>=T());
  if(!pts.length){ toast('이미 지난 날짜뿐이라 등록할 알림이 없습니다'); return; }
  let s='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//GaengsinAlimi//KO\r\nCALSCALE:GREGORIAN\r\nMETHOD:PUBLISH\r\n';
  pts.forEach(p=>{
    const title = p.o ? `[갱신알리미] ${who} ${nm} D-${p.o}` : `[갱신알리미] ${who} ${nm} 오늘 만료`;
    const desc = `${nm} 만료일: ${d.exp}\n${ti.tip||''}`, c=p.dt.replace(/-/g,'');
    s+=`BEGIN:VEVENT\r\nUID:${d.id}-${p.o}@gaengsin-alimi\r\nDTSTAMP:${now}\r\nDTSTART:${c}T090000\r\nDTEND:${c}T091500\r\nSUMMARY:${icsEsc(title)}\r\nDESCRIPTION:${icsEsc(desc)}\r\nBEGIN:VALARM\r\nTRIGGER:PT0M\r\nACTION:DISPLAY\r\nDESCRIPTION:${icsEsc(title)}\r\nEND:VALARM\r\nEND:VEVENT\r\n`;
  });
  s+='END:VCALENDAR\r\n';
  const url=URL.createObjectURL(new Blob([s],{type:'text/calendar;charset=utf-8'}));
  const a=document.createElement('a'); a.href=url;
  // 아이폰은 download 속성 없이 열어야 사파리가 '캘린더에 추가' 화면을 띄운다
  if(IS_IOS){ a.target='_blank'; } else { a.download=`갱신알리미_${who}_${nm}.ics`.replace(/[\\/:*?"<>|()]/g,''); }
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
  toast(`알림 ${pts.length}개를 달력 파일로 만들었습니다`);
}

render();
// 인터넷 없이도 켜지게 (https 주소에서만 동작)
if('serviceWorker' in navigator && location.protocol==='https:'){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
