<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>갱신알리미</title>
<meta name="description" content="해외 주재원 비자·체류증·여권 만료 알림">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="갱신알리미">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#f3f4f6; --card:#ffffff; --ink:#111827; --sub:#6b7280; --line:#e5e7eb;
  --brand:#2563eb; --brand-ink:#ffffff; --red:#dc2626; --red-bg:#fee2e2;
  --yellow:#b45309; --yellow-bg:#fef3c7; --green:#15803d; --green-bg:#dcfce7;
  --gray:#6b7280; --gray-bg:#f3f4f6; --warn-bg:#fff7ed; --warn-line:#fdba74;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0f17; --card:#151b26; --ink:#e5e7eb; --sub:#9ca3af; --line:#273042;
    --brand:#3b82f6; --red:#f87171; --red-bg:#3a1414; --yellow:#fbbf24; --yellow-bg:#3a2a0a;
    --green:#4ade80; --green-bg:#0f2e1a; --gray:#9ca3af; --gray-bg:#1f2633; --warn-bg:#2a1a0a; --warn-line:#9a5b1a;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0f17; --card:#151b26; --ink:#e5e7eb; --sub:#9ca3af; --line:#273042;
  --brand:#3b82f6; --red:#f87171; --red-bg:#3a1414; --yellow:#fbbf24; --yellow-bg:#3a2a0a;
  --green:#4ade80; --green-bg:#0f2e1a; --gray:#9ca3af; --gray-bg:#1f2633; --warn-bg:#2a1a0a; --warn-line:#9a5b1a;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  -webkit-text-size-adjust:100%}
.app{max-width:440px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
@media (min-width:600px){ .app{margin:24px auto;min-height:calc(100vh - 48px);border:1px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.12)} }
header{display:flex;align-items:center;gap:8px;padding:calc(16px + env(safe-area-inset-top)) 16px 8px}
header h1{font-size:20px;margin:0;flex:1}
.back{border:0;background:none;color:var(--ink);font-size:22px;padding:0 6px 0 0;cursor:pointer}
.iconbtn{border:0;background:var(--brand);color:var(--brand-ink);width:36px;height:36px;border-radius:50%;font-size:22px;line-height:36px;cursor:pointer}
main{flex:1;overflow-y:auto;padding:0 16px 96px}
nav.tabs{position:sticky;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;padding:10px 0 14px;color:var(--sub);font-size:12px;cursor:pointer}
nav.tabs button .i{display:block;font-size:20px;margin-bottom:2px}
nav.tabs button.on{color:var(--brand);font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 12px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.doc{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none}
.doc .t{font-weight:700;font-size:15px}
.doc .s{color:var(--sub);font-size:13px;margin-top:2px}
.doc .m{font-size:13px;margin-top:6px;font-weight:600}
.dday{margin-left:auto;font-weight:800;font-size:15px;padding:4px 8px;border-radius:8px;white-space:nowrap}
.lv-red .dot{background:var(--red)} .lv-red .dday{color:var(--red);background:var(--red-bg)} .lv-red .m{color:var(--red)}
.lv-yellow .dot{background:var(--yellow)} .lv-yellow .dday{color:var(--yellow);background:var(--yellow-bg)} .lv-yellow .m{color:var(--yellow)}
.lv-green .dot{background:var(--green)} .lv-green .dday{color:var(--green);background:var(--green-bg)}
.lv-gray .dot{background:var(--gray)} .lv-gray .dday{color:var(--gray);background:var(--gray-bg)} .lv-gray .m{color:var(--gray)}
.empty{text-align:center;color:var(--sub);padding:48px 0}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;background:var(--brand);color:var(--brand-ink);margin-top:10px}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--card);color:var(--red);border:1px solid var(--line)}
.row2{display:flex;gap:8px} .row2 .btn{flex:1}
label.f{display:block;font-size:13px;color:var(--sub);margin:14px 0 6px}
input,select{width:100%;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.sec{font-size:13px;color:var(--sub);font-weight:700;margin:18px 0 8px}
.alerts .a{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.alerts .a:last-child{border-bottom:0}
.alerts .past{color:var(--sub);text-decoration:line-through}
.warn{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:12px;padding:12px;font-size:13px;margin-bottom:10px;line-height:1.5}
.tip{font-size:13px;line-height:1.6;color:var(--ink)}
.tip .src{color:var(--sub);font-size:12px;margin-top:6px}
.banner{background:var(--brand);color:var(--brand-ink);border-radius:12px;padding:12px;font-size:14px;margin-bottom:10px}
.prog{height:6px;background:var(--gray-bg);border-radius:4px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--brand)}
.stage{margin-bottom:10px}
.stage h3{font-size:14px;margin:0;display:flex;justify-content:space-between;cursor:pointer}
.stage h3 span{color:var(--sub);font-weight:400;font-size:12px}
.item{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.45}
.item input{width:20px;height:20px;flex:none;margin-top:1px}
.item .n{font-size:12px;color:var(--sub);margin-top:2px}
.item.done .x{text-decoration:line-through;color:var(--sub)}
.small{font-size:12px;color:var(--sub);line-height:1.5}
.mem{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.mem:last-child{border-bottom:0}
.link{border:0;background:none;color:var(--red);cursor:pointer;font-size:13px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:.95}
</style>
</head>
<body>
<div class="app">
  <header id="hd"></header>

<script src="parsers.js"></script>
<script>
/* ================= 데이터: 나라별 기준 (법이 바뀌면 여기만 고친다) ================= */
const COUNTRIES = {
  VN: {
    name: '베트남',
    docs: {
      passport:  {name:'여권', alerts:[180,90,30],
        tip:'임시거주증(TRC) 기간이 여권 기간에 묶입니다. TRC는 여권 만료 30일 이상 전에 끝나야 합니다. 해외 재발급 처리 기간은 대사관·총영사관 \'여권발급현황\'에서 확인하세요.'},
      visa:      {name:'비자', alerts:[60,30,14], tip:'체류 목적에 맞는 비자 종류와 연장 가능 여부를 회사 담당자와 확인하세요.'},
      trc:       {name:'임시거주증(TRC)', alerts:[60,30,14],
        tip:'만료일이 지나면 연장이 안 되고 처음처럼 새로 신청해야 합니다. 연장 처리는 서류 접수 후 약 5 영업일로 안내됩니다. 노동허가서 연장이 먼저 끝나야 진행할 수 있습니다. 노동(LĐ) 체류증은 최대 2년이며, 여권 만료보다 30일 이상 먼저 끝나게 발급됩니다.'},

      vnlicense: {name:'운전면허(베트남)', alerts:[60,30],
        tip:'유효기간이 체류 서류와 한국 면허 기간에 연동됩니다. 변환 처리는 약 5 영업일로 안내됩니다.'},
      krlicense: {name:'운전면허(한국)', alerts:[90,30], tip:'베트남 면허 기간이 한국 면허에 연동되니 같이 관리하세요.'},
      other:     {name:'기타(직접 입력)', alerts:[60,30,7], tip:''}
    }
  },
  ETC: {
    name: '기타 국가(직접 입력)',
    docs: {
      passport:  {name:'여권', alerts:[180,90,30], tip:'많은 나라가 체류 서류 기간을 여권 기간에 맞춥니다. 여권은 넉넉히 미리 갱신하세요.'},
      visa:      {name:'비자', alerts:[60,30,14], tip:''},
      residence: {name:'체류증', alerts:[60,30,14], tip:''},
      wp:        {name:'취업허가', alerts:[60,30,14], tip:''},
      license:   {name:'운전면허(현지)', alerts:[60,30], tip:''},
      krlicense: {name:'운전면허(한국)', alerts:[90,30], tip:''},
      other:     {name:'기타(직접 입력)', alerts:[60,30,7], tip:''}
    }
  }
};
const SRC_NOTE = '참고용 안내입니다. 최신 기준은 해당 기관에 확인하세요.';

/* 체크리스트: stage.off = 기준일에서 며칠(음수=전) */
const CHECKLISTS = {
  arrive: {
    name:'부임', icon:'✈', baseLabel:'도착(부임) 예정일',
    stages:[
      {id:'pre', name:'출국 전', off:-14},
      {id:'d0',  name:'도착 당일', off:0},
      {id:'m1',  name:'도착 1개월', off:30},
      {id:'m3',  name:'도착 3개월 후', off:90},
      {id:'any', name:'이사할 때마다', off:null}
    ],
    items:[
      {id:'a1', st:'pre', t:'여권 남은 기간 확인', n:'체류 서류 기간이 여권 기간에 묶입니다'},
      {id:'a2', st:'pre', t:'건강보험 \'해외 출국자 급여정지\' 신고', n:'국민건강보험공단 홈페이지'},
      {id:'a3', st:'pre', t:'국민연금 납부예외 신고', n:'귀국 후 납부재개 신고와 짝'},
      {id:'a4', st:'pre', t:'국제운전면허 발급'},
      {id:'a5', st:'pre', t:'해외 이삿짐 견적', aff:true},
      {id:'a6', st:'d0',  t:'거주 신고 확인', n:'베트남: 숙소 운영자(호텔·집주인)가 12시간 안에 공안에 신고. 했는지 확인', c:'VN'},
      {id:'a7', st:'d0',  t:'휴대폰 개통·현지 은행 계좌'},
      {id:'a8', st:'m1',  t:'노동허가서·체류증 발급 → 받으면 바로 앱에 만료일 등록'},
      {id:'a9', st:'m1',  t:'자녀 학교 등록'},
      {id:'a10',st:'m3',  t:'현지 운전면허 변환', n:'베트남: 3개월 이상 거주, 한국 면허 번역 공증 필요', c:'VN'},
      {id:'a11',st:'any', t:'새 집 거주 신고', n:'베트남: 숙소를 옮기면 새 숙소에서 다시 신고', c:'VN'}
    ]
  },
  return: {
    name:'귀임', icon:'🏠', baseLabel:'귀국 예정일',
    stages:[
      {id:'m3', name:'3개월 전', off:-90},
      {id:'m1', name:'1개월 전', off:-30},
      {id:'w2', name:'2주 전', off:-14},
      {id:'after', name:'귀국 후', off:0}
    ],
    items:[
      {id:'r1', st:'m3', t:'집 계약 해지 통보'},
      {id:'r2', st:'m3', t:'자녀 전학 서류 요청'},
      {id:'r3', st:'m3', t:'이삿짐 견적', aff:true},
      {id:'r4', st:'m3', t:'이삿짐 면세 조건 확인', n:'단독 1년 이상·가족 동반 6개월 이상 거주(2차 자료) → 관세청 확인'},
      {id:'r5', st:'m1', t:'개인소득세(PIT) 정산 일정 확인', n:'출국 전 정산 / 출국 후 45일 이내 — 자료마다 다름, 회사 세무 담당에 확인', c:'VN'},
      {id:'r6', st:'m1', t:'은행 계좌·카드, 휴대폰 해지 일정'},
      {id:'r7', st:'w2', t:'보증금 반환·공과금 정산'},
      {id:'r8', st:'w2', t:'차량 처분'},
      {id:'r9', st:'after', t:'노동허가서 회수 확인', n:'베트남: 회사가 무효일부터 15일 안에 반납', c:'VN'},
      {id:'r10',st:'after', t:'주민등록 상태 확인·전입신고', n:'건강보험 자격이 주민등록에 연결'},
      {id:'r11',st:'after', t:'건강보험 급여정지 해제 또는 지역가입 신고', n:'해외 체류 중 면제 기간 추징 사례 있음 → 출입국일 정리'},
      {id:'r12',st:'after', t:'국민연금 납부재개 신고'}
    ]
  }
};

/* ================= 저장 ================= */
const KEY = 'gaengsin-alimi-v1';
function today0(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parse(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function dleft(s){ return Math.round((parse(s)-today0())/86400000); }
function uid(){ return Math.random().toString(36).slice(2,9); }

function sample(){
  const t=today0();
  return {
    country:'VN',
    members:[{id:'me',name:'나'},{id:'sp',name:'배우자'},{id:'c1',name:'자녀1'}],
    docs:[
      {id:uid(),m:'me',type:'trc',exp:ymd(addDays(t,24)),memo:''},
      {id:uid(),m:'me',type:'wp',exp:ymd(addDays(t,71)),memo:''},
      {id:uid(),m:'sp',type:'passport',exp:ymd(addDays(t,812)),memo:''},
      {id:uid(),m:'me',type:'passport',exp:ymd(addDays(t,40)),memo:'끝 4자리 1234'},
      {id:uid(),m:'me',type:'vnlicense',exp:ymd(addDays(t,1240)),memo:''}
    ],
    checks:{}, base:{arrive:'', return:''}, sample:true
  };
}
function empty(){ return {country:'VN', members:[{id:'me',name:'나'}], docs:[], checks:{}, base:{arrive:'',return:''}, sample:false}; }
function load(){ try{ const s=localStorage.getItem(KEY); if(s) return JSON.parse(s); }catch(e){} return empty(); }
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
let S = load();

/* ================= 공통 ================= */
const $ = s=>document.querySelector(s);
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),1800); }
function C(){ return COUNTRIES[S.country]||COUNTRIES.VN; }
function typeInfo(type){ return C().docs[type] || COUNTRIES.VN.docs[type] || COUNTRIES.ETC.docs[type] || {name:type,alerts:[60,30,7],tip:''}; }
function docName(d){ return d.type==='other' ? (d.custom||'기타 서류') : typeInfo(d.type).name; }
function memName(id){ return (S.members.find(m=>m.id===id)||{name:'?'}).name; }
function level(n){ return n<0?'gray':n<=30?'red':n<=90?'yellow':'green'; }
function ddayText(n){ return n<0 ? '만료됨' : n===0 ? 'D-Day' : 'D-'+n.toLocaleString(); }

/* 연동 경고 */
function warnings(d){
  const w=[]; const same=S.docs.filter(x=>x.m===d.m && x.id!==d.id);
  const get=t=>same.find(x=>x.type===t);
  if(S.country==='VN'){
    if(d.type==='trc' || d.type==='passport'){
      const trc = d.type==='trc'?d:get('trc'); const pp = d.type==='passport'?d:get('passport');
      if(trc && pp && parse(trc.exp) > addDays(parse(pp.exp),-30))
        w.push('여권이 임시거주증보다 먼저(또는 30일 안쪽으로) 끝납니다. 여권을 먼저 갱신해야 TRC가 제대로 나옵니다.');
    }
    if(d.type==='trc') w.push('임시거주증 연장은 노동허가서 연장이 먼저 끝나야 진행할 수 있습니다.');
    if(d.type==='vnlicense'){
      const trc=get('trc'), kr=get('krlicense');
      if(trc && parse(d.exp)>parse(trc.exp)) w.push('베트남 운전면허 만료일이 임시거주증보다 늦습니다. 체류 서류가 끝나면 면허도 함께 확인하세요.');
      if(kr && parse(d.exp)>parse(kr.exp)) w.push('베트남 운전면허 만료일이 한국 면허보다 늦습니다. 한국 면허 갱신도 챙기세요.');
    }
  }
  return w;
}

/* ================= 화면 이동 ================= */
let R = {tab:'docs', view:'docs', id:null, filter:'all', justSaved:false, open:{}};
function go(view, opts={}){ Object.assign(R,{view, id:null, justSaved:false}, opts); render(); $('#mn').scrollTop=0; }
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{ R.tab=b.dataset.tab; go(b.dataset.tab); });

function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on', b.dataset.tab===R.tab));
  ({docs:vDocs, edit:vEdit, detail:vDetail, check:vCheck, list:vList, settings:vSettings}[R.view]||vDocs)();
}
function head(title, back, right=''){
  $('#hd').innerHTML = (back?`<button class="back" id="bk">‹</button>`:'')+`<h1>${esc(title)}</h1>${right}`;
  if(back) $('#bk').onclick=back;
}

/* ---- 서류 목록 ---- */
function vDocs(){
  head('내 서류', null, `<button class="iconbtn" id="add" aria-label="서류 추가">+</button>`);
  $('#add').onclick=()=>go('edit');
  const chips = [{id:'all',name:'전체'},...S.members].map(m=>`<button class="chip ${R.filter===m.id?'on':''}" data-f="${m.id}">${esc(m.name)}</button>`).join('');
  let list = S.docs.filter(d=>R.filter==='all'||d.m===R.filter).sort((a,b)=>parse(a.exp)-parse(b.exp));
  let h = `<div class="chips">${chips}</div>`;
  if(S.sample) h += `<div class="small" style="margin-bottom:10px">지금 보이는 서류는 예시입니다. 설정에서 지울 수 있습니다.</div>`;
  if(!list.length) h += `<div class="empty">아직 등록한 서류가 없습니다<br><button class="btn" id="add2" style="max-width:220px;margin:16px auto 0">첫 서류 추가</button></div>`;
  h += list.map(d=>{
    const n=dleft(d.exp), lv=level(n);
    const msg = n<0?'만료되었습니다. 바로 확인하세요' : lv==='red'?'지금 갱신 준비를 시작하세요' : lv==='yellow'?'갱신 서류를 미리 챙기세요':'';
    const w = warnings(d).length ? ' ⚠' : '';
    return `<div class="card doc lv-${lv}" data-id="${d.id}">
      <span class="dot"></span>
      <div style="flex:1;min-width:0"><div class="t">${esc(docName(d))}${w}</div>
        <div class="s">${esc(memName(d.m))} · ${d.exp} 만료</div>
        ${msg?`<div class="m">${msg}</div>`:''}</div>
      <span class="dday">${ddayText(n)}</span></div>`;
  }).join('');
  $('#mn').innerHTML=h;
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{R.filter=b.dataset.f; vDocs();});
  document.querySelectorAll('.doc').forEach(c=>c.onclick=()=>go('detail',{id:c.dataset.id}));
  const a2=$('#add2'); if(a2) a2.onclick=()=>go('edit');
}

/* ---- 서류 추가·수정 ---- */
function vEdit(){
  const ed = R.id ? S.docs.find(d=>d.id===R.id) : null;
  const cur = ed ? {...ed} : {m:S.members[0]?.id||'me', type:'passport', exp:'', memo:'', custom:''};
  head(ed?'서류 수정':'서류 추가', ()=> ed?go('detail',{id:ed.id}):go('docs'));
  const types = Object.entries(C().docs).map(([k,v])=>`<option value="${k}" ${cur.type===k?'selected':''}>${esc(v.name)}</option>`).join('');
  $('#mn').innerHTML = `
    ${ed?'':`<div class="card" style="margin-top:6px">
      <div style="font-weight:700;font-size:14px">서류로 자동 채우기</div>
      <div class="small" style="margin-top:2px">여권·노동허가서를 찍거나 PDF를 올리면 만료일을 찾아 줍니다. 사진과 파일은 휴대폰 안에서만 읽고 저장하지 않습니다.</div>
      <div class="row2"><button class="btn" id="bCam" style="flex:1">📷 사진</button><button class="btn ghost" id="bPdf" style="flex:1">📄 PDF</button></div>
      <input type="file" id="fCam" accept="image/*" capture="environment" style="display:none">
      <input type="file" id="fPdf" accept="application/pdf" style="display:none">
      <div id="scan" class="small" style="margin-top:8px"></div></div>`}
    <label class="f">누구의 서류인가요?</label>
    <div class="chips" id="mm">${S.members.map(m=>`<button class="chip ${cur.m===m.id?'on':''}" data-m="${m.id}">${esc(m.name)}</button>`).join('')}</div>
    <label class="f">서류 종류</label><select id="ty">${types}</select>
    <div id="cw" style="display:${cur.type==='other'?'block':'none'}"><label class="f">서류 이름</label><input id="cu" value="${esc(cur.custom||'')}" placeholder="예: 자녀 학생비자"></div>
    <label class="f">만료일</label><input id="ex" type="date" value="${cur.exp}">
    <label class="f">메모 (선택)</label><input id="me" value="${esc(cur.memo)}" placeholder="서류번호 끝 4자리 등">
    <div class="small" style="margin-top:8px">서류번호 전체는 적지 마세요. 모든 정보는 이 휴대폰 안에만 저장됩니다.</div>
    <button class="btn" id="sv">저장</button>`;
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{cur.m=b.dataset.m; document.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('on',x===b));});
  $('#ty').onchange=e=>{cur.type=e.target.value; $('#cw').style.display=cur.type==='other'?'block':'none';};
  if(!ed){
    $('#bCam').onclick=()=>$('#fCam').click();
    $('#bPdf').onclick=()=>$('#fPdf').click();
    const run=async(file,isPdf)=>{
      if(!file) return;
      const st=$('#scan'); st.style.color=''; st.textContent='읽는 중… (처음 한 번은 읽기 프로그램을 내려받아 조금 걸립니다)';
      try{
        const text = isPdf ? await readPdf(file, m=>st.textContent=m) : await ocr(file, m=>st.textContent=m);
        const r = GA.findExpiry(text);
        if(!r.date){ st.style.color='var(--red)'; st.textContent='만료일을 찾지 못했습니다. 더 밝고 반듯하게 다시 찍거나 직접 입력해 주세요.'; return; }
        if(r.type && C().docs[r.type]){ cur.type=r.type; $('#ty').value=r.type; $('#cw').style.display='none'; }
        $('#ex').value=r.date;
        const nm = r.type && C().docs[r.type] ? C().docs[r.type].name : '서류';
        st.style.color = r.confident ? 'var(--green)' : 'var(--yellow)';
        st.textContent = r.confident ? `✔ ${nm}에서 만료일 ${r.date}을(를) 찾았습니다. 맞는지 보고 저장하세요.`
                                     : `? ${nm}에서 ${r.date}을(를) 만료일로 짐작했습니다. 서류와 꼭 대조해 주세요.`;
      }catch(err){ st.style.color='var(--red)'; st.textContent='읽기에 실패했습니다(인터넷 연결 확인). 직접 입력해 주세요.'; console.error(err); }
    };
    $('#fCam').onchange=e=>run(e.target.files[0],false);
    $('#fPdf').onchange=e=>run(e.target.files[0],true);
  }
  $('#sv').onclick=()=>{
    const exp=$('#ex').value; if(!exp){ toast('만료일을 넣어 주세요'); return; }
    const rec={...cur, type:$('#ty').value, exp, memo:$('#me').value.trim(), custom:$('#cu').value.trim()};
    if(ed){ Object.assign(ed,rec); } else { rec.id=uid(); S.docs.push(rec); }
    save(); go('detail',{id:ed?ed.id:rec.id, justSaved:true, changed:!!ed});
  };
}

/* ---- 서류 읽기: PDF 글자 꺼내기 / 사진 OCR (모두 휴대폰 안에서) ---- */
const LIB = {
  pdf: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
  pdfWorker: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',
  ocr: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js'
};
const _loaded={};
function loadScript(src){ return _loaded[src] ||= new Promise((ok,no)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=no; document.head.appendChild(s); }); }
async function ocr(src, say){
  await loadScript(LIB.ocr);
  const { data } = await Tesseract.recognize(src, 'eng', { logger: m=>{ if(say && m.status==='recognizing text') say(`글자 읽는 중… ${Math.round(m.progress*100)}%`); } });
  return data.text;
}
async function readPdf(file, say){
  await loadScript(LIB.pdf);
  pdfjsLib.GlobalWorkerOptions.workerSrc = LIB.pdfWorker;
  const doc = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  let text='';
  for(let p=1; p<=Math.min(doc.numPages,3); p++){
    const tc = await (await doc.getPage(p)).getTextContent();
    text += tc.items.map(it=>it.str + (it.hasEOL?'\n':' ')).join('') + '\n';
  }
  if(GA.findExpiry(text).date) return text;
  // 글자가 없는 스캔 PDF → 첫 장을 그림으로 그려서 OCR
  say && say('스캔한 PDF라 그림으로 읽는 중…');
  const page = await doc.getPage(1), vp = page.getViewport({ scale: 2 });
  const cv = document.createElement('canvas'); cv.width=vp.width; cv.height=vp.height;
  await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
  return ocr(cv, say);
}

/* ---- 서류 상세 ---- */
function vDetail(){
  const d=S.docs.find(x=>x.id===R.id); if(!d) return go('docs');
  const ti=typeInfo(d.type), n=dleft(d.exp);
  head(docName(d), ()=>go('docs'));
  const offs=[...ti.alerts].sort((a,b)=>b-a);
  const rows=offs.map(o=>{ const dt=addDays(parse(d.exp),-o); const past=dt<today0();
    return `<div class="a ${past?'past':''}"><span>D-${o}</span><span>${ymd(dt)}${past?' (지남)':''}</span></div>`; }).join('')
    + `<div class="a"><span>만료일</span><span>${d.exp}</span></div>`;
  const w=warnings(d);
  let h='';
  if(R.justSaved) h+=`<div class="banner">${R.changed?'수정했습니다. 달력 일정도 다시 등록해 주세요 (이미 등록한 일정은 앱에서 바꿀 수 없습니다).':'저장했습니다. 아래 버튼으로 휴대폰 달력에 알림을 등록하세요.'}</div>`;
  h+=`<div class="card"><div style="display:flex;align-items:center" class="lv-${level(n)}">
      <div><div class="small">${esc(memName(d.m))}</div><div style="font-size:15px;font-weight:700;margin-top:2px">${d.exp} 만료</div></div>
      <span class="dday" style="margin-left:auto">${ddayText(n)}</span></div>
      ${d.memo?`<div class="small" style="margin-top:8px">메모: ${esc(d.memo)}</div>`:''}</div>`;
  h+=w.map(x=>`<div class="warn">⚠ ${esc(x)}</div>`).join('');
  h+=`<div class="sec">알림 일정</div><div class="card alerts">${rows}</div>
      <button class="btn" id="cal">📅 휴대폰 달력에 등록</button>
      <div class="small" style="margin-top:6px">지나지 않은 날짜만 오전 9시 알림으로 들어갑니다.</div>`;
  if(ti.tip) h+=`<div class="sec">갱신 준비 안내</div><div class="card tip">${esc(ti.tip)}<div class="src">${SRC_NOTE}</div></div>`;
  h+=`<div class="row2"><button class="btn ghost" id="ed">수정</button><button class="btn danger" id="del">삭제</button></div>`;
  $('#mn').innerHTML=h;
  $('#cal').onclick=()=>downloadICS(d);
  $('#ed').onclick=()=>go('edit',{id:d.id});
  $('#del').onclick=()=>{ if(confirm('이 서류를 삭제할까요?')){ S.docs=S.docs.filter(x=>x.id!==d.id); save(); go('docs'); toast('삭제했습니다'); } };
}

/* ---- 달력 파일(.ics) ---- */
function icsEsc(s){ return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n'); }
function compact(d){ return ymd(d).replace(/-/g,''); }
function downloadICS(d){
  const ti=typeInfo(d.type), who=memName(d.m), nm=docName(d);
  const now=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const pts=[...ti.alerts.map(o=>({o,dt:addDays(parse(d.exp),-o)})), {o:0,dt:parse(d.exp)}].filter(p=>p.dt>=today0());
  if(!pts.length){ toast('이미 지난 날짜뿐이라 등록할 알림이 없습니다'); return; }
  let s='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//GaengsinAlimi//KO\r\nCALSCALE:GREGORIAN\r\nMETHOD:PUBLISH\r\n';
  pts.forEach(p=>{
    const title = p.o ? `[갱신알리미] ${who} ${nm} D-${p.o}` : `[갱신알리미] ${who} ${nm} 오늘 만료`;
    const desc = `${nm} 만료일: ${d.exp}\n${ti.tip||''}`;
    s+=`BEGIN:VEVENT\r\nUID:${d.id}-${p.o}@gaengsin-alimi\r\nDTSTAMP:${now}\r\nDTSTART:${compact(p.dt)}T090000\r\nDTEND:${compact(p.dt)}T091500\r\nSUMMARY:${icsEsc(title)}\r\nDESCRIPTION:${icsEsc(desc)}\r\nBEGIN:VALARM\r\nTRIGGER:PT0M\r\nACTION:DISPLAY\r\nDESCRIPTION:${icsEsc(title)}\r\nEND:VALARM\r\nEND:VEVENT\r\n`;
  });
  s+='END:VCALENDAR\r\n';
  const url=URL.createObjectURL(new Blob([s],{type:'text/calendar;charset=utf-8'}));
  const a=document.createElement('a'); a.href=url;
  // 아이폰은 download 속성 없이 열어야 사파리가 '캘린더에 추가' 화면을 띄운다
  if(IS_IOS){ a.target='_blank'; } else { a.download=`갱신알리미_${who}_${nm}.ics`.replace(/[\\/:*?"<>|()]/g,''); }
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
  toast(`알림 ${pts.length}개를 달력 파일로 만들었습니다`);
}

/* ---- 체크리스트 ---- */
function itemsFor(key){ return CHECKLISTS[key].items.filter(i=>!i.c || i.c===S.country); }
function vCheck(){
  head('체크리스트');
  $('#mn').innerHTML = Object.entries(CHECKLISTS).map(([k,c])=>{
    const its=itemsFor(k), done=its.filter(i=>S.checks[k+':'+i.id]).length;
    const pct=Math.round(done/its.length*100);
    return `<div class="card" data-l="${k}" style="cursor:pointer"><div style="font-weight:700;font-size:16px">${c.icon} ${c.name}</div>
      <div class="small" style="margin-top:4px">${done?`${its.length}개 중 ${done}개 완료`:'시작 전'}${S.base[k]?` · ${c.baseLabel} ${S.base[k]}`:''}</div>
      <div class="prog"><i style="width:${pct}%"></i></div></div>`;
  }).join('') + `<div class="small">나라를 바꾸면 그 나라 항목이 함께 바뀝니다 (설정 → 사는 나라).</div>`;
  document.querySelectorAll('[data-l]').forEach(c=>c.onclick=()=>go('list',{id:c.dataset.l}));
}
function vList(){
  const k=R.id, c=CHECKLISTS[k]; head(c.name+' 체크리스트', ()=>go('check'));
  const base=S.base[k];
  let h=`<label class="f">${c.baseLabel}</label><input type="date" id="bd" value="${base||''}">
         <div class="small" style="margin:6px 0 12px">이 날짜로 단계별 시기를 계산합니다.</div>`;
  h+=c.stages.map(st=>{
    const its=itemsFor(k).filter(i=>i.st===st.id); if(!its.length) return '';
    const when = (base && st.off!==null) ? ymd(addDays(parse(base),st.off))+(st.off<0?'까지':st.off>0?' 무렵':'') : '';
    const open = R.open[k+st.id]!==false;
    return `<div class="card stage"><h3 data-s="${st.id}">${open?'▼':'▶'} ${st.name} <span>${when}</span></h3>
      ${open?its.map(i=>{ const on=!!S.checks[k+':'+i.id];
        return `<label class="item ${on?'done':''}"><input type="checkbox" data-i="${i.id}" ${on?'checked':''}>
          <div><div class="x">${esc(i.t)}</div>${i.n?`<div class="n">${esc(i.n)}</div>`:''}</div></label>`; }).join(''):''}</div>`;
  }).join('');
  h+=`<div class="small" style="margin-top:8px">${SRC_NOTE}</div>`;
  $('#mn').innerHTML=h;
  $('#bd').onchange=e=>{ S.base[k]=e.target.value; save(); vList(); };
  document.querySelectorAll('[data-s]').forEach(x=>x.onclick=()=>{ const key=k+x.dataset.s; R.open[key]=R.open[key]===false; vList(); });
  document.querySelectorAll('[data-i]').forEach(x=>x.onchange=()=>{ S.checks[k+':'+x.dataset.i]=x.checked; save(); x.closest('.item').classList.toggle('done',x.checked); });
}

/* ---- 설정 ---- */
function vSettings(){
  head('설정');
  const cs=Object.entries(COUNTRIES).map(([k,v])=>`<option value="${k}" ${S.country===k?'selected':''}>${esc(v.name)}</option>`).join('');
  $('#mn').innerHTML=`
    <div class="sec">사는 나라</div>
    <div class="card"><select id="ct">${cs}</select>
      <div class="small" style="margin-top:8px">지금은 베트남 안내만 들어 있습니다. 다른 나라는 서류 이름과 만료일을 직접 넣으면 알림은 똑같이 됩니다.</div></div>
    <div class="sec">가족 구성원</div>
    <div class="card">${S.members.map(m=>`<div class="mem"><span>${esc(m.name)}</span>${m.id==='me'?'<span class="small">기본</span>':`<button class="link" data-rm="${m.id}">삭제</button>`}</div>`).join('')}
      <div class="row2" style="margin-top:10px"><input id="nm" placeholder="예: 자녀2"><button class="btn" id="am" style="margin:0;width:90px;flex:none">추가</button></div></div>
    <div class="sec">백업</div>
    <div class="card"><div class="small">휴대폰을 바꿀 때 파일로 옮기세요.</div>
      <div class="row2"><button class="btn ghost" id="ex">내보내기</button><button class="btn ghost" id="im">불러오기</button></div>
      <input type="file" id="fi" accept="application/json" style="display:none"></div>
    <div class="sec">개인정보</div>
    <div class="card small">회원가입이 없고, 입력한 정보는 서버로 보내지 않고 이 휴대폰 안에만 저장합니다.</div>
    ${S.sample?'<button class="btn danger" id="clr">예시 서류 지우고 시작하기</button>':''}`;
  $('#ct').onchange=e=>{ S.country=e.target.value; save(); toast(C().name+'(으)로 바꿨습니다'); };
  $('#am').onclick=()=>{ const v=$('#nm').value.trim(); if(!v) return; S.members.push({id:uid(),name:v}); save(); vSettings(); };
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.rm, cnt=S.docs.filter(d=>d.m===id).length;
    if(!confirm(cnt?`이 구성원의 서류 ${cnt}개도 함께 지워집니다. 삭제할까요?`:'삭제할까요?')) return;
    S.members=S.members.filter(m=>m.id!==id); S.docs=S.docs.filter(d=>d.m!==id); if(R.filter===id) R.filter='all'; save(); vSettings(); });
  $('#ex').onclick=()=>{ const url=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));
    const a=document.createElement('a'); a.href=url; a.download=`갱신알리미_백업_${ymd(today0())}.json`; a.click(); setTimeout(()=>URL.revokeObjectURL(url),2000); };
  $('#im').onclick=()=>$('#fi').click();
  $('#fi').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{ try{ const o=JSON.parse(r.result); if(!o.docs||!o.members) throw 0; S=o; save(); toast('불러왔습니다'); vSettings(); }catch(_){ toast('백업 파일이 아닙니다'); } }; r.readAsText(f); };
  const clr=$('#clr'); if(clr) clr.onclick=()=>{ S.docs=[]; S.checks={}; S.sample=false; save(); toast('예시를 지웠습니다'); R.tab='docs'; go('docs'); };
}

render();

if('serviceWorker' in navigator && location.protocol==='https:'){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
